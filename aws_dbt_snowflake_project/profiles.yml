aws_dbt_snowflake_project:
  target: dev
  outputs:
    dev:
      type: snowflake
      account: "<<account>>"
      user: "<<user>>"
      password: "<<password>>$"
      role: "<<role>>"
      database: "AIRBNB"
      warehouse: "<<warehouse>>"
      schema: "<<schema>>"
      threads: 1
      client_session_keep_alive: False
